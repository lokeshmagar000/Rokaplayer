<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- background of the rounded square -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F4D"/>
      <stop offset="0.55" stop-color="#0D1030"/>
      <stop offset="1" stop-color="#05061A"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.22" cy="0.82" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <!-- the HDR light gradient of the play symbol -->
    <linearGradient id="hdr" x1="0.15" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#5EF2FF"/>
      <stop offset="0.38" stop-color="#7C6CFF"/>
      <stop offset="0.72" stop-color="#E558F5"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EF2FF"/>
      <stop offset="0.5" stop-color="#9D7BFF"/>
      <stop offset="1" stop-color="#FF7AD9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
    <clipPath id="tri">
      <path d="M 440 352 L 440 672 L 712 512 Z" stroke-linejoin="round"/>
    </clipPath>
  </defs>

  <!-- soft shadow under the icon -->
  <rect x="112" y="128" width="800" height="800" rx="180" fill="#000" opacity="0.45" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowCyan)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowPink)"/>
    <!-- glass sheen on the top half -->
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- progress ring (track + bright arc) -->
    <circle cx="512" cy="512" r="292" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="18"/>
    <circle cx="512" cy="512" r="292" fill="none" stroke="url(#ring)" stroke-width="18"
            stroke-linecap="round" stroke-dasharray="1330 600" transform="rotate(-90 512 512)"/>
    <circle cx="512" cy="512" r="292" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.6"
            stroke-linecap="round" stroke-dasharray="1330 600" transform="rotate(-90 512 512)" filter="url(#blur10)"/>

    <!-- glow behind the play symbol -->
    <path d="M 440 352 L 440 672 L 712 512 Z" fill="url(#hdr)" stroke="url(#hdr)" stroke-width="86"
          stroke-linejoin="round" opacity="0.75" filter="url(#blur40)"/>

    <!-- play symbol with rounded corners -->
    <path d="M 440 352 L 440 672 L 712 512 Z" fill="url(#hdr)" stroke="url(#hdr)" stroke-width="86"
          stroke-linejoin="round"/>
    <!-- glossy highlight on the play symbol -->
    <path d="M 440 352 L 440 672 L 712 512 Z" fill="url(#gloss)" stroke="url(#gloss)" stroke-width="86"
          stroke-linejoin="round" opacity="0.9" transform="translate(0 0)"
          style="mix-blend-mode:screen"/>
  </g>

  <!-- thin glass edge -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
